name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - name: Verify generated dependency notices
        run: |
          node check/scripts/generate-notices.mjs
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: pnpm turbo run lint typecheck build test --force
      - run: pnpm --filter @proofline/check bundle:check

  unsupported-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Reject Node 20 when the bundle is executed directly
        shell: bash
        run: |
          set +e
          output="$(env -i PATH="$PATH" node check/dist/index.js 2>&1)"
          status=$?
          set -e
          expected="::error::Proofline requires Node 22 or Node 24; received $(node -p 'process.versions.node')"
          test "$status" -eq 2
          test "$output" = "$expected"
